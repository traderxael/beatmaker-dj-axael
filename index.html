<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeatMaker DJ — Axael</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;text-align:center;padding:16px;margin:0}
h1{font-size:1.3rem;margin:8px 0 2px}.sub{opacity:.6;font-size:.85rem;margin-bottom:12px}
.panel{background:#1e293b;border-radius:16px;padding:12px;max-width:560px;margin:0 auto 12px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px auto}
.pad{height:62px;border-radius:12px;border:0;font-weight:800;cursor:pointer;background:#334155;color:#fff}
.pad:active,.pad.on{transform:scale(.95);outline:3px solid #38bdf8}
.seq{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.step{height:34px;border-radius:8px;border:0;background:#334155;color:#fff;cursor:pointer;font-size:.8rem}
.step.on{background:#38bdf8;color:#020617}.step.play{background:#facc15;color:#000}
.btn{padding:10px 16px;border-radius:10px;border:0;background:#38bdf8;color:#020617;font-weight:800;cursor:pointer}
.btn.alt{background:#334155;color:#fff}input[type=range]{width:120px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.small{font-size:.82rem;opacity:.7}
</style></head><body>
<h1>🎛️ BeatMaker DJ — Axael</h1><div class="sub">Original · Drums + Melodía + Bajos + Secuenciador</div>
<div class="panel"><div class="row"><button class="btn" id="play">▶ Play</button><button class="btn alt" id="stop">⏹ Stop</button><span>BPM <input id="bpm" type="number" value="120" min="60" max="180" style="width:64px"></span><span>🔊 <input id="vol" type="range" min="0" max="100" value="80"></span></div><div class="small">Tocá pads o activá pasos</div></div>
<div class="panel"><b>🥁 Drums</b><div class="pads" id="drums"></div><b>🎹 Melodía C menor</b><div class="pads" id="melody"></div><b>🔊 Bajos / FX libres (sintetizados)</b><div class="pads" id="bass"></div></div>
<div class="panel"><b>🔁 Secuenciador 16 pasos</b><div class="seq" id="seq"></div><div class="row" style="margin-top:10px"><button class="btn alt" id="rand">🎲 Aleatorio</button><button class="btn alt" id="clear">🧹 Limpiar</button><button class="btn alt" id="presets">💾 Guardar</button></div><div class="small" id="saved"></div></div>
<div class="panel small">Sonidos 100% sintetizados WebAudio (CC0/original) · Sin FL Studio</div>
<script>
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const volEl=document.getElementById('vol');
function gainVal(){return volEl.value/100*0.5}
function tone(f,dur=.35,type='sine',gVal){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(gVal||gainVal(),ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}
function noise(dur=.1,freq=1000){const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=ctx.createGain();g.gain.value=gainVal();s.connect(f).connect(g).connect(ctx.destination);s.start()}
function kick(){tone(60,.25,'sine')} function snare(){noise(.15,1800)} function hihat(){noise(.05,8000)}
function subBass(){tone(55,.5,'sine')}
function acidBass(){tone(110,.2,'sawtooth')}
function pluck(){tone(523.25,.3,'triangle')}
function padSound(){tone(261.63,.8,'sine',gainVal()*0.4);tone(392,.8,'sine',gainVal()*0.3)}
function riser(){noise(.6,400)}
function drop(){tone(800,.6,'sawtooth');tone(80,.6,'sine')}
const drumDef=[['KICK',kick,'#f97316'],['SNARE',snare,'#eab308'],['HIHAT',hihat,'#22c55e'],['CLAP',()=>noise(.12,1200),'#a855f7']];
const drumsEl=document.getElementById('drums');
drumDef.forEach(([name,fn,col])=>{const b=document.createElement('button');b.className='pad';b.style.background=col;b.textContent=name;b.onclick=()=>{fn();b.classList.add('on');setTimeout(()=>b.classList.remove('on'),150)};drumsEl.appendChild(b)});
const notes=[130.81,155.56,196,233.08,261.63,311.13,392,466.16];const names=['C3','D#3','G3','A#3','C4','D#4','G4','A#4'];const melEl=document.getElementById('melody');
notes.forEach((f,i)=>{const b=document.createElement('button');b.className='pad';b.textContent=names[i];b.onclick=()=>{tone(f);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),150)};melEl.appendChild(b)});
const bassDef=[['SUB',subBass],['ACID',acidBass],['PLUCK',pluck],['PAD',padSound],['RISER',riser],['DROP',drop],['KICK+',kick],['BASS2',()=>tone(65.41,.4,'square')]];
const bassEl=document.getElementById('bass');
bassDef.forEach(([name,fn])=>{const b=document.createElement('button');b.className='pad';b.textContent=name;b.onclick=()=>{fn();b.classList.add('on');setTimeout(()=>b.classList.remove('on'),150)};bassEl.appendChild(b)});
let steps=new Array(16).fill(false),playing=false,timer=null,cur=0;const seqEl=document.getElementById('seq');
function renderSeq(){seqEl.innerHTML='';steps.forEach((on,i)=>{const b=document.createElement('button');b.className='step'+(on?' on':'')+(playing&&i===cur?' play':'');b.textContent=i+1;b.onclick=()=>{steps[i]=!steps[i];renderSeq()};seqEl.appendChild(b)})}
function tick(){renderSeq();if(steps[cur]){tone(notes[cur%notes.length],.2,'triangle');if(cur%4===0)kick();if(cur%8===4)snare();if(cur%2===1)hihat();if(cur%4===2)subBass()}cur=(cur+1)%16}
document.getElementById('play').onclick=()=>{if(playing)return;playing=true;cur=0;const bpm=parseInt(document.getElementById('bpm').value)||120;timer=setInterval(tick,60000/bpm/2);renderSeq()};
document.getElementById('stop').onclick=()=>{playing=false;clearInterval(timer);renderSeq()};
document.getElementById('rand').onclick=()=>{steps=steps.map(()=>Math.random()>0.5);renderSeq()};
document.getElementById('clear').onclick=()=>{steps=new Array(16).fill(false);renderSeq()};
document.getElementById('presets').onclick=()=>{localStorage.setItem('beatmaker-pattern',JSON.stringify({steps,bpm:document.getElementById('bpm').value}));document.getElementById('saved').textContent='Patrón guardado ✓'};
try{const s=JSON.parse(localStorage.getItem('beatmaker-pattern')||'null');if(s&&s.steps){steps=s.steps;document.getElementById('bpm').value=s.bpm||120;document.getElementById('saved').textContent='Patrón cargado ✓'}}catch(e){}
renderSeq();
</script></body></html>
